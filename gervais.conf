<VirtualHost *:80>
    ServerName your_domain_or_ip  # Replace with your server's domain or IP

    ProxyRequests Off
    ProxyPreserveHost On

    <Proxy *>
        Order deny,allow
        Allow from all
    </Proxy>

    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/gervais_error.log
    CustomLog ${APACHE_LOG_DIR}/gervais_access.log combined

    # Optional: Set headers for security
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set X-Frame-Options "DENY"
</VirtualHost>
